<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fractal</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
        #hud {
            position: fixed; top: 12px; left: 12px;
            padding: 8px 12px; border-radius: 6px;
            background: rgba(0, 0, 0, 0.6); color: #e8e8ee;
            font: 13px/1.5 Consolas, Menlo, monospace;
            white-space: pre;      /* keep the line breaks from formatHud */
            pointer-events: none;  /* let drags and scrolls pass through to the canvas */
        }
        /* Button bar along the bottom, centered: out of the HUD's way and easy to reach with a thumb */
        #toolbar {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px;
        }
        #toolbar button {
            padding: 8px 14px; border: none; border-radius: 6px;
            background: rgba(0, 0, 0, 0.6); color: #e8e8ee;
            font: 13px Consolas, Menlo, monospace;
            white-space: nowrap; cursor: pointer;
        }
        #toolbar button:hover { background: rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="toolbar">
    <button id="fractal" type="button" title="Switch fractal (F)">Mandelbrot</button>
    <button id="palette" type="button" title="Switch colors (C)">Purple</button>
    <button id="reset" type="button" title="Reset view (R)">Reset</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
