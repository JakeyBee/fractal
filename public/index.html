<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fractal</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
        #hud {
            position: fixed; top: 12px; left: 12px;
            padding: 8px 12px; border-radius: 6px;
            background: rgba(0, 0, 0, 0.6); color: #e8e8ee;
            font: 13px/1.5 Consolas, Menlo, monospace;
            white-space: pre;      /* keep the line breaks from formatHud */
            pointer-events: none;  /* let drags and scrolls pass through to the canvas */
        }
    </style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<script type="module" src="main.js"></script>
</body>
</html>
